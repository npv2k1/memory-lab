name: Deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published immutable tag: sha-<40-character commit SHA>'
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: memory-lab-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, memory-lab-deploy]
    environment: production
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo 'Invalid immutable image tag'; exit 1; }
          [[ "$DEPLOY_ENV_FILE" = /* && -f "$DEPLOY_ENV_FILE" ]] || { echo 'Set DEPLOY_ENV_FILE to an existing absolute .env path on this runner'; exit 1; }
          echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy
        run: |
          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180
      - name: Container status
        if: always()
        run: docker compose -f docker-compose.deploy.yml ps
