name: CI and images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Run Python unit & integration tests
        run: uv run --no-sync pytest -v
      - name: Validate Colab benchmark notebook
        run: |
          uv run --no-sync python -c '
          import ast, json
          from pathlib import Path
          nb = json.loads(Path("notebooks/memory_benchmark_colab.ipynb").read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          for cell in nb["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))
          print("Colab notebook syntax OK")
          '
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          DOMAIN=memory.example.com docker compose -f docker-compose.prod.yml --profile graph --profile tls config --quiet
          docker compose -f docker-compose.enterprise.yml config --quiet
          REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,} IMAGE_TAG=sha-$GITHUB_SHA DEPLOY_ENV_FILE=.env docker compose -f docker-compose.deploy.yml config --quiet
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra e2e
      - run: uv run --no-sync playwright install --with-deps chromium
      - name: Start isolated E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180
      - name: Browser & HTTP E2E
        run: uv run --no-sync pytest tests/e2e -v
        env:
          E2E: '1'
          E2E_BASE_URL: http://localhost:4321
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.e2e.yml logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
      - name: Clean isolated stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
  images:
    needs: [checks, e2e]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            target: production
          - service: api-enterprise
            context: .
            target: enterprise
          - service: web
            context: ./apps/web
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}/${{ matrix.service }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [ "$REF_TYPE" = "tag" ]; then
              echo "${IMAGE}:${REF_NAME}"
              echo "${IMAGE}:latest"
            else
              echo "${IMAGE}:main"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
