[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-lab"
version = "0.1.0"
description = "Pluggable document processing and agent memory research"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "qdrant-client>=1.14,<1.15"]

[project.optional-dependencies]
docling = ["docling>=2.30,<3"]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_lab", "apps"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
