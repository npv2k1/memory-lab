name: memory-lab
services:
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifacts:/data", "models:/root/.cache"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [qdrant]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3); urllib.request.urlopen('http://qdrant:6333/readyz', timeout=3)"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 12
  web:
    build: ./apps/web
    restart: unless-stopped
    ports: ["127.0.0.1:4321:4321"]
    depends_on:
      api:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
  neo4j:
    image: neo4j:5.26-community
    profiles: [memory]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memory-lab-local}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j:/data"]
  redis:
    image: redis:7.4-alpine
    profiles: [memory]
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    command: [redis-server, --appendonly, "yes"]
volumes:
  artifacts:
  models:
  qdrant:
  neo4j:
  redis:
