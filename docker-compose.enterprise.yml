name: memory-lab-enterprise

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-enterprise-env: &enterprise-env
  DATA_DIR: /data
  AUTH_MODE: ${AUTH_MODE:-enterprise}
  JWT_SECRET: ${JWT_SECRET:-change-me-enterprise-jwt-secret-min-32-chars}
  ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-change-me-bootstrap-admin-key}
  DATABASE_URL: postgresql://${POSTGRES_USER:-memorylab}:${POSTGRES_PASSWORD:-memorylab_secret}@postgres:5432/${POSTGRES_DB:-memorylab}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  NEO4J_URL: http://neo4j:7474
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-memorylab_neo4j_secret}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-memory-lab}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-memorylab}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-memorylab_minio_secret}
  RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-600}
  DEFAULT_MEMORY_STRATEGY: ${DEFAULT_MEMORY_STRATEGY:-hybrid}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:4321"]}
  METRICS_ENABLED: "true"

services:
  # --- Edge Reverse Proxy & Load Balancer ---
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/enterprise/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge, internal]
    logging: *default-logging

  # --- Stateless SaaS Web Tier (Horizontally Scalable) ---
  web:
    build:
      context: ./apps/web
      target: production
    image: ${REGISTRY_PREFIX:-ghcr.io/npv2k1/memory-lab}/web:${IMAGE_TAG:-main}
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10

  # --- Stateless Enterprise API Tier (Horizontally Scalable) ---
  api:
    build:
      context: .
      target: enterprise
    image: ${REGISTRY_PREFIX:-ghcr.io/npv2k1/memory-lab}/api-enterprise:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: ${API_REPLICAS:-2}
    env_file:
      - path: ${ENTERPRISE_ENV_FILE:-.env.enterprise}
        required: false
    environment: *enterprise-env
    command:
      - uvicorn
      - apps.api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-2}"
      - --proxy-headers
      - --forwarded-allow-ips=*
    volumes:
      - shared_artifacts:/data
      - shared_models:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 6s
      start_period: 25s
      retries: 12

  # --- Async Document Processing & Indexing Worker Tier (Horizontally Scalable) ---
  worker:
    build:
      context: .
      target: enterprise
    image: ${REGISTRY_PREFIX:-ghcr.io/npv2k1/memory-lab}/api-enterprise:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-build}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    env_file:
      - path: ${ENTERPRISE_ENV_FILE:-.env.enterprise}
        required: false
    environment: *enterprise-env
    command: ["python", "-m", "apps.worker.main", "--poll-interval", "0.5"]
    volumes:
      - shared_artifacts:/data
      - shared_models:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import memory_lab.enterprise.jobs; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Relational Metadata, Tenants, API Keys, Jobs & Audit Store ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memorylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorylab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-memorylab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorylab} -d ${POSTGRES_DB:-memorylab}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Distributed Rate Limiter & Async Job Broker ---
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # --- High-Scale Vector Search Engine ---
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  # --- Enterprise Knowledge Graph Engine ---
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memorylab_neo4j_secret}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INIT:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
    volumes:
      - neo4j_data:/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 15

  # --- S3-Compatible Object Storage (MinIO) for Durable Large Document Artifacts ---
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memorylab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memorylab_minio_secret}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memorylab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memorylab_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-memory-lab}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
    networks: [internal]

  # --- Observability: Prometheus + Grafana ---
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/enterprise/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [internal]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-memorylab_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/enterprise/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/enterprise/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [internal]
    logging: *default-logging

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  shared_artifacts:
  shared_models:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
